examination_boundaries:
  - Completing the square is not an examinable quadratic-solving method.
  - Quadratic equations using substitution (the k-method) are examinable.
  - Surd equations leading to quadratic equations are examinable.
  - Non-quadratic inequalities connect to functions.
  - Nature of roots connects to quadratic equations and prescribed functions.
